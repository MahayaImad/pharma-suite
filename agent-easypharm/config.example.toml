# Copier en config.toml et adapter. Ne jamais committer config.toml.

[source]
# Serveur HFSQL Client/Serveur d'EASYPHARM, lu par le provider OLE DB
# PCSOFT.HFSQL (à installer sur le poste : « Provider OLE DB pour HFSQL »).
server = "localhost"
port = 4900
database = "EASYPHARM"     # Initial Catalog : nom de la base HFSQL
user = "admin"
# Mot de passe des FICHIERS HFSQL, exigé pour lire chaque table.
# Envoyé en Extended Properties="Password=*:<mdp>;" (* = toutes les tables).
# Ne doit contenir ni ; ni ".
password = ""
# Lecture par tranches.
fetch_size = 500
# Propriétés étendues OLE DB supplémentaires, ajoutées telles quelles après
# Password=*:… dans Extended Properties. Vide par défaut. Sans guillemet ".
proprietes_extra = ""

[api]
base_url = "http://192.168.1.10:8000/api/v1"
username = "sync_agent"
password = ""          # settings.sync_agent_password côté backend
timeout_seconds = 60
batch_size = 500

[agent]
# Intervalle entre deux passes complètes (en secondes).
# Si respecter_intervalles = true, cet intervalle est le minimum entre passes,
# et chaque table respecte son propre intervalle (défini dans tables.py).
interval_seconds = 300

# Mode legacy : les tables 'full' sont relues en entier toutes les N passes.
# Ignoré si respecter_intervalles = true (on utilise alors intervalle_minutes par table).
full_resync_every = 12

# Utilise les intervalles définis par table (true) ou mode legacy (false).
# En mode intervalles :
#   - sorties_produits, entrees_produits : 15 min
#   - sorties, entrees, operations : 30 min
#   - nomenclature, clients : 4h
#   - familles, formes, etc. : 24h (nightly)
respecter_intervalles = true

state_file = "agent_state.json"
log_file = "agent.log"
