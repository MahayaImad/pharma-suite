services:

  postgres:
    image: postgres:16-alpine
    container_name: pharmasuite_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pharmasuite}
      POSTGRES_USER: ${DB_USER:-pharmasuite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pharmasuite_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pharmasuite} -d ${DB_NAME:-pharmasuite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      network: host
      dockerfile: Dockerfile
    container_name: pharmasuite_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pharmasuite_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@pharmasuite.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
